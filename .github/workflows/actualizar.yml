name: Actualizar sitio completo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limpiar y desempaquetar
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          unzip -o mahas-massage-montaje.zip -d .
          rm -f mahas.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Actualizar sitio completo desde el zip" || echo "sin cambios"
          git push
