name: Actualizar sitio completo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limpiar y descomprimir
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '*.zip' -exec rm -rf {} +
          unzip -o *.zip -d .
          rm *.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Sitio actualizado desde ZIP" || echo "Sin cambios"
          git push
          
