<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAHAS MASSAGE</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#171614">

  <!-- Raiz: elige idioma segun el navegador y redirige. TODO el Worker puede hacerlo con 302 en el chat 2 -->
  <link rel="alternate" hreflang="es" href="https://mahasmassage.com/es/">
  <link rel="alternate" hreflang="en" href="https://mahasmassage.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://mahasmassage.com/">
  <noscript><meta http-equiv="refresh" content="0; url=/es/"></noscript>
  <script>
    (function () {
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'es'];
      var target = /^en/i.test(langs[0]) ? '/en/' : '/es/';
      location.replace(target);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 1.25rem; background: #171614; color: #F2EEE5; font-family: Georgia, serif; text-align: center; }
    a { color: #B79A68; letter-spacing: 0.25em; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <a href="/es/">ESPAÑOL</a>
  <a href="/en/">ENGLISH</a>
</body>
</html>
